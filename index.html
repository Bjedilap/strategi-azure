<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strategi 2026–2029 – Spama og Sem & Stenersen Prokom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#EAE4DC; --primary:#D3CABC; --secondary:#A8A29B;
  --ink:#1a1a1a; --ink-soft:#5b5650; --line:#ddd5ca; --tri1:#EAE4DC; --tri2:#DED7CC; --chip:#f4f0ea;
  --display:"Montserrat", "Trebuchet MS", system-ui, sans-serif;
  --body:"Source Sans 3", "Source Sans Pro", "Segoe UI", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1d1b19; --surface:#2a2724; --primary:#4a443d; --secondary:#8f8880;
    --ink:#f1ece5; --ink-soft:#bdb5aa; --line:#3a3631; --tri1:#2a2724; --tri2:#34302b; --chip:#26231f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d1b19; --surface:#2a2724; --primary:#4a443d; --secondary:#8f8880;
  --ink:#f1ece5; --ink-soft:#bdb5aa; --line:#3a3631; --tri1:#2a2724; --tri2:#34302b; --chip:#26231f;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.brand svg{width:34px;height:34px}
.brand span{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.2}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav::-webkit-scrollbar{display:none}
nav a{font-weight:600;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:5px;white-space:nowrap;color:var(--ink-soft)}
nav a:hover{color:var(--ink);background:var(--chip)}
nav a[aria-current="page"]{background:var(--primary);color:var(--ink)}

/* Nedtrekksmenyer */
.dd{display:flex;align-items:center;flex-shrink:0;border-radius:5px}
.dd:hover,.dd.open{background:var(--chip)}
.dd.cur{background:var(--primary)}
.dd > a,.dd > a:hover,.dd > a[aria-current="page"]{background:none}
.dd:hover > a,.dd.cur > a,.dd.cur .dd-btn{color:var(--ink)}
.dd > a{padding-right:6px}
.dd-btn{appearance:none;border:0;background:none;color:var(--ink-soft);cursor:pointer;padding:10px 10px 10px 4px;display:flex;align-items:center;font:inherit}
.dd-btn:hover,.dd.open .dd-btn{color:var(--ink)}
.dd-btn svg{width:10px;height:6px;transition:transform .2s}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-menu{--acc:#d83f0a;display:none;position:absolute;top:100%;width:260px;max-width:calc(100vw - 16px);background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--acc);box-shadow:0 12px 28px rgba(0,0,0,.12);padding:6px 0;z-index:6}
.dd-menu.pk{--acc:#0033A0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dd-menu.pk{--acc:#6b93e8}}
:root[data-theme="dark"] .dd-menu.pk{--acc:#6b93e8}
.dd-menu::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:16px}
.dd.open .dd-menu{display:block}
@media(hover:hover){.dd:hover .dd-menu{display:block}}
.dd-menu a{display:block;padding:10px 18px;border-radius:0;color:var(--ink);font-weight:600;font-size:15px;white-space:normal}
.dd-menu a:hover{background:var(--chip)}
.dd-menu a[aria-current="page"]{background:var(--primary)}
.dd-menu .dd-all{font-weight:400;color:var(--ink-soft);border-bottom:1px solid var(--line);margin-bottom:4px}

main{max-width:1180px;margin:0 auto;padding:0 24px 80px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.2;margin:0}
h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.01em}
h2{font-size:clamp(22px,3vw,30px);margin-bottom:16px}
h3{font-size:19px}
p{margin:0 0 14px;max-width:72ch}
.lead{font-size:20px;font-weight:600;line-height:1.45;max-width:60ch}
.muted{color:var(--ink-soft)}
section{margin-top:56px}

/* Hero with template triangles */
.hero{position:relative;overflow:hidden;background:var(--primary);margin:24px -24px 0;padding:40px 48px 64px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end}
@media(min-width:1228px){.hero{margin:24px 0 0;border-radius:0}}
.hero .tri{position:absolute;transform:rotate(45deg);pointer-events:none}
.hero .t1{width:520px;height:520px;background:var(--tri1);opacity:.75;right:-180px;bottom:-330px}
.hero .t2{width:340px;height:340px;background:var(--tri2);opacity:.6;left:-230px;top:40px}
.hero .t3{width:260px;height:260px;background:var(--bg);opacity:.35;left:-190px;bottom:-150px}
.hero > *:not(.tri){position:relative}
.hero .logo{width:70px;height:70px;flex-shrink:0;margin-bottom:auto}
.hero:not(.small) h1{margin-top:32px}
.hero h1{max-width:16ch}
.hero .lead{margin-top:14px}
.hero.small{min-height:240px;padding-top:56px}
.hero.small .logo{display:none}
.crumb{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--ink-soft)}
.crumb a{text-decoration:none;border-bottom:1px solid var(--secondary)}
/* Produkt-hero i profilfarge */
.hero.ph{background:var(--hb);color:var(--hi)}
.hero.ph .t1{background:#fff;opacity:.14}
.hero.ph .t2{background:#fff;opacity:.10}
.hero.ph .t3{background:#fff;opacity:.12}
.plogo{display:block;height:clamp(36px,5vw,52px);width:auto;max-width:100%}

/* Priority list */
.prio{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:var(--line);border:1px solid var(--line)}
.prio div{background:var(--bg);padding:22px 22px 24px}
.prio h3{font-size:18px;margin-bottom:6px}
.prio p{font-size:16px;margin:0;color:var(--ink-soft)}

/* Company panels and product links */
.companies{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}
.company{background:var(--surface);padding:28px;border-radius:0}
.company h2{margin-bottom:6px}
.company > p{color:var(--ink-soft);font-size:16px}
.plist{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
.plist a{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.pname{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.plist a:hover .pname{text-decoration-thickness:2px}
.pname{font-family:var(--display);font-weight:600;font-size:17px}
.pnum{font-weight:600;text-align:right;white-space:nowrap}
.pnum small{display:block;font-weight:400;font-size:13px;color:var(--ink-soft)}
.pstat{grid-column:1/-1;font-size:15px;color:var(--ink-soft)}
.company .more{display:inline-block;margin-top:18px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--ink)}

/* Key figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px;margin-top:-1px;background:var(--line);border:1px solid var(--line)}
.figs div{background:var(--bg);padding:18px 20px}
.figs b{display:block;font-family:var(--display);font-weight:600;font-size:26px}
.figs span{font-size:14px;color:var(--ink-soft)}
.bcg{display:inline-block;background:var(--bg);padding:6px 14px;border-radius:999px;font-weight:600;font-size:15px;margin-top:16px}

/* Two-column text */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}

/* Accordions */
.tiltak{border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:18px 40px 18px 0;position:relative;font-family:var(--display);font-weight:600;font-size:17px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:8px;top:50%;width:10px;height:10px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 28px;padding:0 0 22px}
.tgrid h4{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--ink-soft)}
.tgrid p{font-size:16px;margin:0}
.tgrid .kpi{background:var(--chip);padding:12px 14px;border-left:3px solid var(--secondary)}

/* Bulleted lists */
ul.dots{margin:0;padding-left:20px}
ul.dots li{margin-bottom:8px;max-width:70ch}
.ki-box{background:var(--surface);padding:24px 28px;border-radius:0}
.cols > .ki-box,.cols > .company{align-self:start}
/* Svart tekst i bokser (lys modus) */
:root:not([data-theme="dark"]) .ki-box,:root:not([data-theme="dark"]) .ki-box *,:root:not([data-theme="dark"]) .company,:root:not([data-theme="dark"]) .company *,:root:not([data-theme="dark"]) .tgrid .kpi,:root:not([data-theme="dark"]) .tgrid .kpi *{color:#000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ki-box,:root:not([data-theme="light"]) .ki-box *,:root:not([data-theme="light"]) .company,:root:not([data-theme="light"]) .company *,:root:not([data-theme="light"]) .tgrid .kpi,:root:not([data-theme="light"]) .tgrid .kpi *{color:var(--ink)}}
.ki-box h3{margin-bottom:12px}
.note{border-left:3px solid var(--secondary);padding:4px 0 4px 16px;margin-top:16px;font-size:16px}

/* Table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:16px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-soft);font-size:14px}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:600}

.questions{margin:8px 0 0;padding:0;list-style:none;counter-reset:q}
.questions li{counter-increment:q;position:relative;display:flex;align-items:center;gap:16px;padding:10px 0;font-family:var(--display);font-weight:600;font-size:18px}
.questions li::before{content:counter(q);flex-shrink:0;width:40px;height:40px;display:grid;place-items:center;background:var(--primary);color:var(--ink);font-size:17px;position:relative;z-index:1}
.questions li:not(:last-child)::after{content:"";position:absolute;left:19px;top:50px;height:calc(100% - 40px);width:2px;background:var(--secondary)}

.swot{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:720px){.swot{grid-template-columns:1fr}}

.prev-next{display:flex;justify-content:space-between;gap:16px;margin-top:56px;border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap}
.prev-next a{text-decoration:none;font-weight:600}
.prev-next small{display:block;font-weight:400;color:var(--ink-soft);font-size:14px}

/* Produktfliser på forsiden */
.pgroup{margin-top:28px}
.pgroup + .pgroup{margin-top:56px}
.pgroup-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.pgroup-head a{font-weight:600;text-decoration:none;border-bottom:1px solid var(--ink);font-size:15px}
.pgroup-title{font-size:22px}
.pgroup-title.pk{--acc:#0033A0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pgroup-title.pk{--acc:#6b93e8}}
:root[data-theme="dark"] .pgroup-title.pk{--acc:#6b93e8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{--acc:#d83f0a;display:flex;flex-direction:column;gap:10px;min-height:220px;padding:22px 22px 18px;background:var(--surface);border-top:4px solid var(--acc);border-radius:0;text-decoration:none;transition:background .15s,transform .15s}
.tile.pk{--acc:#0033A0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.pk{--acc:#6b93e8}}
:root[data-theme="dark"] .tile.pk{--acc:#6b93e8}
.tile:hover{background:var(--primary)}
@media(prefers-reduced-motion:no-preference){.tile:hover{transform:translateY(-2px)}}
.tile h4{font-size:22px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.tile:hover h4{text-decoration-thickness:2px}
.tile p{font-size:15px;color:#000;margin:0;flex:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile p{color:var(--ink)}}
:root[data-theme="dark"] .tile p{color:var(--ink)}
.tile-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.tile-foot b{font-family:var(--display);font-weight:600;font-size:20px;display:block;white-space:nowrap}
.tile-foot small{font-size:13px;color:var(--ink-soft)}
.tile-go{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;white-space:nowrap}
.tile-go .arrow{width:35px;height:35px;flex-shrink:0;display:block;color:var(--ink)}
@media(prefers-reduced-motion:no-preference){.tile-go .arrow{transition:transform .15s}.tile:hover .tile-go .arrow{transform:translateX(4px)}}
.chip{display:inline-block;align-self:flex-start;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg)}
.clogo{display:block;height:34px;width:auto;max-width:100%}
.hero .clogo{height:clamp(44px,7vw,64px)}
.crumb .clogo{height:22px}
.plate{display:inline-block;line-height:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .plate{background:#fff;padding:8px 12px;border-radius:0}}
:root[data-theme="dark"] .plate{background:#fff;padding:8px 12px;border-radius:0}
footer{max-width:1180px;margin:0 auto;padding:24px;font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line)}

@media(max-width:640px){
  .bar{padding:10px 16px;gap:12px}
  .brand span{display:none}
  main{padding:0 16px 64px}
  .hero{margin:16px -16px 0;padding:28px 24px 40px;min-height:320px}
  .hero .logo{width:52px;height:52px}
  .hero:not(.small) h1{margin-top:24px}
  .hero.small{padding-top:40px;min-height:200px}
  .company{padding:22px}
}
@media(prefers-reduced-motion:no-preference){
  #view{animation:in .35s ease}
  @keyframes in{from{opacity:0}to{opacity:1}}
}
</style>
</head>

    <polygon fill="currentColor" points="348.8,7.2 395.1,43.8 357.2,69.9 357.2,54.7 348.8,54.7 348.8,87.3 409.3,44.1 354.5,0.4"/>

<header>
  <div class="bar">

    <span class="pname">${p.navn}</span><span class="pnum">${p.netto} MNOK<small>mål nettobidrag 2029</small></span>
    <span class="pstat">${p.status} Andel av konsernomsetning 2029: ${p.andel}.</span></a></li>`}).join('')}</ul>`;
}

function tiles(key){
  const cls = key==='spama'?'sp':'pk', co = key==='spama'?'Spama':'Prokom';
  return `<div class="pgroup">
    <div class="pgroup-head"><h3 class="pgroup-title ${cls}">${key==='spama'?'Spama':'Sem &amp; Stenersen Prokom'}</h3><a href="#${key}">Les om ${co}</a></div>
    <div class="tiles">${ORDER[key].map(id=>{const p=P[id];return `
      <a class="tile ${cls}" href="#${id}">
        <h4>${p.navn}</h4>
        <p>${p.ingress}</p>
        <span class="tile-foot">
          <span><b>${p.netto} MNOK</b><small>nettobidrag 2029</small></span>
          <span class="tile-go">${p.tiltak.length} tiltak <svg class="arrow" viewBox="0 -960 960 960" aria-hidden="true"><path fill="currentColor" d="m560-240-56-58 142-142H160v-80h486L504-662l56-58 240 240-240 240Z"/></svg></span>
        </span>
      </a>`}).join('')}</div>
  </div>`;
}

function render(){
  let r=(location.hash||'').replace('#','')||'oversikt';
  if((!V[r] && !P[r]) || HIDDEN.includes(r)) r='oversikt';
  const active = P[r] ? P[r].selskap : r;
  document.getElementById('nav').innerHTML = NAV.map(([k,l])=>ORDER[k]?ddItem(k,l,active,r):`<a href="#${k}" ${k===active?'aria-current="page"':''}>${l}</a>`).join('');
  const view=document.getElementById('view');
  view.innerHTML = P[r] ? productView(r) : V[r]();
  view.style.animation='none'; void view.offsetWidth; view.style.animation='';
  document.title = (P[r]?P[r].navn: (NAV.find(n=>n[0]===r)||[0,'Strategi'])[1]) + ' – Strategi 2026–2029';
  window.scrollTo(0,0);
  const cur=document.querySelector('nav a[aria-current]'); if(cur) cur.scrollIntoView({block:'nearest',inline:'center'});
  placeDD();
}

function ddItem(k,l,active,r){
  const co=k==='spama'?'Spama':'Sem & Stenersen Prokom', cls=k==='spama'?'sp':'pk';
  return `<div class="dd${k===active?' cur':''}"><a href="#${k}" ${k===active?'aria-current="page"':''}>${l}</a><button class="dd-btn" type="button" aria-expanded="false" aria-controls="dd-${k}" aria-label="Vis produktområder i ${l}"><svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <div class="dd-menu ${cls}" id="dd-${k}"><a class="dd-all" href="#${k}">Om ${co}</a>${ORDER[k].map(id=>`<a href="#${id}" ${id===r?'aria-current="page"':''}>${P[id].navn}</a>`).join('')}</div></div>`;
}
const navEl=document.getElementById('nav');
function placeDD(){navEl.querySelectorAll('.dd').forEach(d=>{const x=d.getBoundingClientRect().left;d.querySelector('.dd-menu').style.left=Math.max(8,Math.min(x,window.innerWidth-268))+'px'})}
function closeDD(except){navEl.querySelectorAll('.dd.open').forEach(d=>{if(d!==except){d.classList.remove('open');d.querySelector('.dd-btn').setAttribute('aria-expanded','false')}})}
navEl.addEventListener('click',e=>{const b=e.target.closest('.dd-btn');if(!b)return;const d=b.parentElement;closeDD(d);placeDD();const o=d.classList.toggle('open');b.setAttribute('aria-expanded',o)});
navEl.addEventListener('mouseover',e=>{if(e.target.closest('.dd'))placeDD()});
navEl.addEventListener('scroll',placeDD,{passive:true});
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeDD()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=navEl.querySelector('.dd.open');if(o){closeDD();o.querySelector('.dd-btn').focus()}}});
window.addEventListener('resize',placeDD);
window.addEventListener('hashchange',render);
render();
</script>
